# yaml-language-server: $schema=./node_modules/lefthook/schema.json

pre-commit:
  parallel: true
  commands:
    client-lint:
      root: client/
      glob: "*.{ts,tsx}"
      run: pnpm exec eslint --max-warnings=0 {staged_files}
    client-typecheck:
      root: client/
      glob: "*.{ts,tsx}"
      run: pnpm exec tsc -b
    server-lint:
      root: server/
      glob: "*.ts"
      run: pnpm exec eslint --max-warnings=0 {staged_files}
    server-typecheck:
      root: server/
      glob: "*.ts"
      run: pnpm typecheck

post-merge:
  commands:
    root-install:
      run: git diff --quiet ORIG_HEAD HEAD -- pnpm-lock.yaml || pnpm install --frozen-lockfile
    client-install:
      root: client/
      run: git diff --quiet ORIG_HEAD HEAD -- pnpm-lock.yaml || pnpm install --frozen-lockfile
    server-install:
      root: server/
      run: git diff --quiet ORIG_HEAD HEAD -- pnpm-lock.yaml || pnpm install --frozen-lockfile

post-checkout:
  commands:
    root-install:
      run: '[ "{3}" = 0 ] || git diff --quiet {1} {2} -- pnpm-lock.yaml || pnpm install --frozen-lockfile'
    client-install:
      root: client/
      run: '[ "{3}" = 0 ] || git diff --quiet {1} {2} -- pnpm-lock.yaml || pnpm install --frozen-lockfile'
    server-install:
      root: server/
      run: '[ "{3}" = 0 ] || git diff --quiet {1} {2} -- pnpm-lock.yaml || pnpm install --frozen-lockfile'
